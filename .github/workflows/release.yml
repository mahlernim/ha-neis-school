name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build integration archive
        run: cd custom_components/neis_school && zip -r ../../neis_school.zip .
      - uses: softprops/action-gh-release@v3
        with:
          files: neis_school.zip
