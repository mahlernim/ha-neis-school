name: 기능 제안
description: 공개 NEIS 데이터를 활용한 새 기능을 제안해 주세요
title: "[기능] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Home Assistant 활용 방법
      description: 이 기능이 어떤 자동화나 화면에 도움이 되는지 설명해 주세요.
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: 공식 NEIS API 또는 문서
      description: 관련 공개 API나 문서 링크가 있다면 적어주세요.
