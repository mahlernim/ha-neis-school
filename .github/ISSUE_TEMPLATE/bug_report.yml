name: Bug report
description: Report a reproducible NEIS School problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste your NEIS API key.
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or logs
