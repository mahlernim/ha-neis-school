name: 버그 신고
description: 재현할 수 있는 나이스 학교생활 문제를 알려주세요
title: "[버그] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 감사합니다. NEIS 인증키는 절대로 붙여 넣지 마세요.
        가능하면 통합 구성요소의 **진단 정보 다운로드**로 저장한 파일을 첨부해 주세요.
  - type: input
    id: version
    attributes:
      label: 통합 구성요소 버전
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant 버전
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 어떤 동작을 기대했고 실제로는 어떻게 동작했는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있는 순서를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 진단 정보 또는 로그
      description: 자동으로 가려진 진단 파일이나 관련 로그를 첨부하세요. 인증키는 포함하지 마세요.
