name: 버그 신고 / Bug report
description: 재현할 수 있는 문제를 알려주세요 / Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        한국어 또는 영어로 작성하세요. NEIS 인증키는 절대로 붙여 넣지 마세요.
        가능하면 통합 구성요소의 **진단 정보 다운로드**로 저장한 파일을 첨부해 주세요.
        Korean or English is welcome. Never include your NEIS API key.
        Attach a diagnostic download from the integration if possible.
  - type: input
    id: version
    attributes:
      label: 통합 구성요소 버전 / Integration version
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant 버전 / Version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 문제 설명 / Problem
      description: 기대한 동작과 실제 동작을 적어주세요. / Describe expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법 / Steps to reproduce
      description: 문제를 다시 확인할 수 있는 순서를 적어주세요. / List the steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 진단 정보 또는 로그 / Diagnostics or logs
      description: 진단 파일이나 관련 로그를 첨부하세요. 인증키는 제외하세요. / Attach diagnostics or relevant logs without API keys.
